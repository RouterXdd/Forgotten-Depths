desc = Mod themed around game: "Corebound" by Overcurve\n\nOriginally supposed to be an april fools version of Buried In Ice, but i fucked up with deadlines\n\n\n[red]WARNING: Mod is not going to explain its own mechanics directly, so... READ THE DAMN DESCRIPTIONS OF BLOCKS please...
idk = [gray]My personal letter for you:\nThis is my last mod on this game. I am just tired from mindustry and its mods, that feels now so ordianary (ESPECIALLY json/hjson ones) and doesn't even TRY to add new mechanics...\nJust mods on new planets, that is so the same and soulless.\nI wanted to break with modding of this game, but fate decided to force me to make mod...\n[red]ONE\nMORE\nTIME[]
